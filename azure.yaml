# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: tdd-tollbooth
metadata:
  template: tdd-tollbooth@0.0.1
infra:
   provider: "bicep"
services:
  fastcardev-saveplatedatafunction:
    project: src/FastCarDev.SavePlateDataFunction
    host: function
    language: js
  fastcardev-uploadimage:
    project: src/FastCarDev.UploadImage
    host: appservice
    language: dotnet
  fastcardev-tollboothfunction:
    project: src/FastCarDev.TollBoothFunction/TollBooth
    host: function
    language: dotnet
hooks:
  postdeploy:
    shell: pwsh
    interactive: true
    run: |
      # Expected Environment Variables:
      # DATALAKE_STORAGE_NAME, PROCESS_IMAGE_FN_NAME, SAVEPLATE_FN_NAME, EVENTGRID_TOPIC_NAME, RG_NAME

      # populate the variables from azd env get-value
      $DATALAKE_STORAGE_NAME = azd env get-value DATALAKE_STORAGE_NAME
      $PROCESS_IMAGE_FN_NAME = azd env get-value PROCESS_IMAGE_FN_NAME
      $SAVEPLATE_FN_NAME = azd env get-value SAVEPLATE_FN_NAME
      $EVENTGRID_TOPIC_NAME = azd env get-value EVENTGRID_TOPIC_NAME
      $RG_NAME = azd env get-value RG_NAME

      $key = az functionapp keys list -g $RG_NAME -n $PROCESS_IMAGE_FN_NAME --query systemKeys.blobs_extension --output tsv

      az deployment group create -f infra/eventgridsub.bicep -g $RG_NAME --parameters `
      dataLakeAccountName=$DATALAKE_STORAGE_NAME `
      processImageFnName=$PROCESS_IMAGE_FN_NAME `
      eventGridTopicName=$EVENTGRID_TOPIC_NAME `
      savePlateFnName=$SAVEPLATE_FN_NAME `
      blobExtensionKey=$key


